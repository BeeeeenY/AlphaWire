name: Daily AlphaWire

on:
  schedule:
    - cron: "*/5 * * * *" # Diagnostic: every 5 minutes
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  alpha-wire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ALPHAWIRE_USE_LIVE_OPENAI: ${{ vars.ALPHAWIRE_USE_LIVE_OPENAI || 'false' }}
        run: python bots/news_bot.py

      - name: Wait before review
        run: sleep 300

      - name: Review daily briefing
        env:
          REVIEW_TELEGRAM_BOT_TOKEN: ${{ secrets.REVIEW_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ALPHAWIRE_USE_LIVE_OPENAI: ${{ vars.ALPHAWIRE_USE_LIVE_OPENAI || 'false' }}
          NEWS_BOT_USERNAME: ${{ secrets.NEWS_BOT_USERNAME }}
        run: python bots/review_bot.py
