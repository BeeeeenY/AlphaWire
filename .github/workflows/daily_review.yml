name: Daily AlphaWire Review

on:
  schedule:
    - cron: "10 3 * * *" # 11:10 AM Singapore time
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest news receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          run_id="$(gh run list --workflow daily_news.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "No successful daily_news.yml run found."
            exit 1
          fi
          gh run download "$run_id" --name latest-news-post --dir data

      - name: Review daily briefing
        env:
          REVIEW_TELEGRAM_BOT_TOKEN: ${{ secrets.REVIEW_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ALPHAWIRE_USE_LIVE_OPENAI: ${{ vars.ALPHAWIRE_USE_LIVE_OPENAI || 'false' }}
          NEWS_BOT_USERNAME: ${{ secrets.NEWS_BOT_USERNAME }}
        run: python bots/review_bot.py
